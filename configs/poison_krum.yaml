# Sign-flip + Gaussian model poisoning (20% malicious) vs Krum.
# poison_scale < 0 flips the update direction (gradient ascent attack).
seed: 42
n_clients: 20
malicious_fraction: 0.2
samples_per_client: 200
n_features: 10
dirichlet_alpha: 0.5
local_epochs: 2
lr: 0.05
rounds: 20
attack: gaussian_poison
poison_scale: -5.0
poison_noise_std: 1.0
defense: krum
krum_m: 1
